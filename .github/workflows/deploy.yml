name: Build and deploy website
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn check
      - run: yarn test
      - run: yarn build
        env:
          ASTRO_SITE: ${{ vars.ASTRO_SITE || 'https://thomasfloss.com' }}
          ASTRO_BASE: ''
          ASTRO_TELEMETRY_DISABLED: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: dist
          include-hidden-files: true
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: github-pages
      url: https://thomasfloss.com
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: website
          path: dist
      - name: Publish static site
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          clean: false
